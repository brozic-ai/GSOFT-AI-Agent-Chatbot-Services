  "requests>=2.32.5",
  "langchain-google-genai>=4.3.2",
  "langchain-openai>=1.4.1",
  "langchain-core>=1.5.3",
  "sqlalchemy>=2.0.51",
  "pyodbc>=5.3.0",
  "jsonpatch>=1.33",
  "jsonpointer>=3.1.1",
  "httpx>=0.27.0",
  "cachetools>=5.5.0",
  "python-multipart>=0.0.20",
  "langchain-text-splitters>=0.3.0",
  "python-docx>=1.1.0",
