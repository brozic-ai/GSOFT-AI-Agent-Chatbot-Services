[project]
name = "dev-llm-service"
version = "0.1.0"
description = "Backend AI Agent Service với Agentic RAG và Phân Quyền Tài Liệu RBAC"
readme = "README.md"
authors = [
    { name = "Brozic2908", email = "brozic@example.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "langchain",
  "langsmith",
  "python-dotenv",
  "requests>=2.32.5",
  "langchain-google-genai>=4.3.2",
  "langchain-openai>=1.4.1",
  "langchain-core>=1.5.3",
  "sqlalchemy>=2.0.51",
  "pyodbc>=5.3.0",
  "jsonpatch>=1.33",
  "jsonpointer>=3.1.1",
  "httpx>=0.27.0",
  "cachetools>=5.5.0",
  "python-multipart>=0.0.20",
  "langchain-text-splitters>=0.3.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.1",
  "pypdf>=5.1.0",
  "torch>=2.6.0",
  "numpy>=2.0.0",
  "sentence-transformers>=3.0.0",
  "ruff>=0.16.2",
  "mypy>=2.3.0",
  "openpyxl>=3.1.5",
  "markitdown>=0.1.0",
  "underthesea>=6.8.0",
  "langfuse>=2.0.0",
  "pandas>=3.0.5",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.2.0",
]

[tool.uv]
package = false
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload"
upload = "python scripts/upload_documents.py"
eval = "python scripts/run_eval.py"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "rich>=14.0.0",
]
